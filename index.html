
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>☀ Weather App</h1>
        <p>Check the weather of your city</p>
    </header>

    <main>

        <div class="search">
            <input type="text" id="cityInput"
            placeholder="Enter city name...">

            <button id="searchBtn">Search</button> 
            <button id="locationBtn">Use My Location</button>
        </div>

        <p id="message"></p>

        <section class="weather-info" id="weatherInfo">

            <div class="weather-main">
                <span id="weatherIcon">🌤️</span>
                <h2 id="temperature">--°C</h2>
            </div>

            <h2 id="cityName">City Name</h2>

            <p id="condition">Weather Condition</p>

            <div class="weather-details">
                <p>💧 Humidity: <span id="humidity">--</span>%</p>
            </div>

        </section>


        <section class="forecast-section" id="forecastSection">

            <h2>Next 5 Days</h2>

                <div class="forecast-container" id="forecastContainer">

                </div>

        </section>


    </main>

    <footer>
        <p>Made with care ☁️</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
